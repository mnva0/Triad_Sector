# Loadout groups for the infrastructure roles. The Contractor* groups carry every department's
# kit (chef belts, medical HUDs, mime masks); these curate the engineering-appropriate subset
# from the same loadout prototypes, plus a few plant-specific additions defined below.
- type: loadoutGroup
  id: InfrastructureTools
  name: loadout-group-contractor-tools
  minLimit: 0
  maxLimit: 2
  loadouts:
  - PlantGasAnalyzer
  - PlantWelder
  - ContractorNetworkConfigurator
  - ContractorGeigerCounter
  - ContractorRadioHandheld
  - PlantHolofanProjector
  - PlantRPD
  - PlantRCD
  - PlantRCDAmmo

- type: loadoutGroup
  id: InfrastructureFace
  name: loadout-group-contractor-face
  minLimit: 0
  loadouts:
  - ContractorClothingMaskBreath
  - ContractorClothingMaskGas
  - ContractorClothingMaskGasAtmos
  - ContractorClothingMaskNeckGaiter
  - ContractorClothingMaskNeckGaiterRed

- type: loadoutGroup
  id: InfrastructureEars
  name: loadout-group-contractor-ears
  loadouts:
  - ContractorClothingHeadsetEngineeringCommon
  - ContractorClothingHeadsetAltEngineeringCommon
  - ContractorClothingHeadsetGreyCommon
  fallbacks:
  - ContractorClothingHeadsetEngineeringCommon
